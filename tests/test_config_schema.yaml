# =============================================================================
# Spyre PyTorch Test Configuration — YAML Schema
# =============================================================================
# This file documents the schema for Spyre test config files.
# All fields are optional unless marked required.
#
# Environment variables
# ---------------------
# SPYRE_PYTORCH_TEST_FILTER_TYPE=whitelist | blacklist
# SPYRE_PYTORCH_TEST_CONFIG=<path>   path to this YAML file
# PYTORCH=<path>                     root of pytorch checkout (for rel_path resolution)
# TORCH_SPYRE=<path>                 root of torch-spyre checkout (for rel_path resolution)
# =============================================================================

tests:
  files:
    # rel_path: path to the upstream test file relative to a root defined by an env var.
    # Use ${PYTORCH}    for upstream pytorch tests  (e.g. pytorch/test/test_binary_ufuncs.py)
    # Use ${TORCH_SPYRE} for torch-spyre tests       (e.g. torch-spyre/tests/test_foo.py)
    # The token is resolved at runtime using the corresponding env variable.
    - rel_path: ${PYTORCH}/test/test_binary_ufuncs.py

      allow_list:
        - test: <ClassName>::<test_method>    # required: class and method joined by ::
                                              # e.g. TestBinaryUfuncs::test_scalar_support

          # mode controls how pytest treats this test (default: mandatory_pass)
          #   mandatory_pass  -> regular pass/fail, CI fails if test fails (default)
          #   xfail           -> pytest.mark.xfail(strict=False): xpass allowed, CI does not fail
          #   xfail_strict    -> pytest.mark.xfail(strict=True):  xpass fails CI
          mode: mandatory_pass | xfail | xfail_strict   # optional, default: mandatory_pass

          tags:                             # optional: free-form labels for reporting/traceability
            - <str>                         # e.g. model names that depend on this test passing

          edits:                            # optional: test-specific overrides
            extra_allowed_dtypes:           # inject dtypes missing from upstream @ops(allowed_dtypes=(...))
              - <dtype_str>                 # without this, those variants are never instantiated
            precision_override: <float>     # numeric precision threshold, e.g. 1e-3
            unsupported_dtypes:             # per-test override of global unsupported_dtypes
              - <dtype_str>                 # takes precedence over global.unsupported_dtypes
            supported_shapes:               # optional
              - <torch.Shape>

      block_list:
        - test: <ClassName>::<test_method>  # required: use inline comments for failure reason
                                            # e.g. - test: TestBinaryUfuncs::test_add  # Failed
  # per-test edits.unsupported_dtypes overrides this
  global:
    unsupported_dtypes:                     # dtype variants skipped automatically in blacklist mode
      - <dtype_str>                         # matched by suffix in generated test method names
                                            # e.g. test_foo_spyre_float32 skipped if float32 listed
    # supported_ops:
    # - <str>
    # supported_shapes:
    # - <torch.Shape>                                      


# ── valid dtype strings ───────────────────────────────────────────────────────
# float16 | float32 | float64 | bfloat16
# int8    | int16   | int32   | int64
# uint8   | uint16  | uint32  | uint64
# complex32 | complex64 | complex128
# bool
