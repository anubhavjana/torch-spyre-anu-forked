test_suite_config:
  files:
    - path: ${TORCH_DEVICE_ROOT}/tests/inductor/test_inductor_ops.py
      unlisted_test_mode: skip
      tests:
        - names:
            # All parameterized keepdim shape variants and test_reduce_*.
            # Note: test_argmin_keepdim0 and test_logsumexp_keepdim0_known_xfail
            # are matched here via .*keepdim.* and intentionally excluded from
            # the scalar shard to avoid overlap.
            # k_expr: keepdim or test_reduce
            - TestOps::.*keepdim.*
            - TestOps::test_reduce.*
          mode: mandatory_success
          tags:
            - inductor
            - inductor_ops_reductions_keepdim
