version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5000:5000"
    environment:
      # ClickHouse connection details
      SPYRE_CH_URL: ${SPYRE_CH_URL:-https://your-clickhouse-host.com:8443}
      SPYRE_CH_DB: ${SPYRE_CH_DB:-spyre}
      SPYRE_CH_USER: ${SPYRE_CH_USER:-default}
      SPYRE_CH_TOKEN: ${SPYRE_CH_TOKEN}
      PORT: 5000
    networks:
      - spyre-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Frontend (nginx serving dashboard.html)
  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./dashboard.html:/usr/share/nginx/html/dashboard.html:ro
      - ./spyre-clickhouse.js:/usr/share/nginx/html/spyre-clickhouse.js:ro
      - ./nginx-local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - spyre-network

networks:
  spyre-network:
    driver: bridge

