test_suite_config:
  files:
    - rel_path: ${PYTORCH}/test/test_binary_ufuncs.py
      unlisted_test_mode: block
      tests:
        - test: TestBinaryUfuncs::test_scalar_support
          mode: mandatory_success # mandatory_success (default), xfail, xfail_strict
          tags:
            - model_name_depending_on_this_test_1
          edits:
            ops:
              include: # required only if the particular test was not using the op but we want it.
                - name: add
              exclude: # required only if the particular test was using the op AND is supported 
                        # but we dont want to run the test with that op.
                - name: gcd
            dtypes: # if the op is specifying the dtype too, we take the intersection of edits and global op dtype 
            # if precision is always taken from supported_ops.dtypes.precision section.

            # include is a dict in case if we want to add more fields in future, e.g. precision.
            # exclude can be just a list of strings (names)
              include:
                - name: float16
                - name: int64
              exclude:
                - name: bfloat16
            # shapes:
            #   k1: 
            #   k2: 
        - test: TestBinaryUfuncs::test_contig_vs_transposed
          mode: xfail
          tags:
            - model_name_depending_on_this_test_2


    - rel_path: ${PYTORCH}/test/test_ops.py
      unlisted_test_mode: block
      tests:
        - test: TestCommon::test_compare_cpu # export PYTORCH_TEST_WITH_SLOW=1
          mode: mandatory_success
          edits:
            dtypes:
              exclude:
                - name: float32 # test_ops.py::TestCommonPRIVATEUSE1::test_compare_cpu__refs__conversions_float_spyre_float32
                        # corrupted double-linked list

  global:
    supported_dtypes:
      - float16
      - int64
    supported_ops:
      - name: add
        force_xfail: false
        # if test mode is mandatory_success, flips the test mode to xfail. 
        # If the test mode is either xfail or xfail_strict, it will remain unchanged. 
        dtypes:
          - name: float16
            precision:
              atol: 1e-3
              rtol: 1e-3
          - name: int64
      - name: mul
      - name: sub
      - name: gcd
        force_xfail: false
